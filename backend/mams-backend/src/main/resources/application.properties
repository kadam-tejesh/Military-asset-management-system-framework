spring.application.name=mams-backend
# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/military?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=tejesh@07
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-at-least-32-chars}
jwt.expiration-ms=86400000

# Swagger (optional)
springdoc.swagger-ui.path=/swagger-ui.html

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000